[build-system]
requires = ["setuptools==83.0.0", "setuptools-git-versioning >= 2"]
build-backend = "setuptools.build_meta"

[tool.setuptools-git-versioning]
enabled = true

[project]
name = "piblin"
authors = [
    { name = "Matthew John Mills", email = "mmills2@mmm.com" },
    { name = "Douglas Elmore", email = "dlelmore@mmm.com" },
    { name = "Alex Bourque", email = "abourque@mmm.com" },
    { name = "Bryce Williams" },
    { name = "Joel Patrow" },
    { name = "Kyle Kalstabakken" },
    { name = "Mahsa Lotfollahi" },
    { name = "Alessandro Perego", email = "aperego@mmm.com" },
    { name = "Maryam Pardakhti", email = "mpardakhti@mmm.com" },
    { name = "Bjorn Melin", email = "bmelin@mmm.com" },
    { name = "Bryan Cote", email = "bcote@mmm.com" },
    { name = "Cole Stapleton", email = "cstapleton@mmm.com" },
]
description = "Measurement data science functionality"
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10, <3.14"

license = { text = "Proprietary" }
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
]

dependencies = [
    "matplotlib ==3.10.0",
    "numpy >=2",
    "scipy ==1.15.1",
    "pandas ==2.2.3",
]

[project.urls]
Source = "https://github.com/3mcloud/piblin"
Issues = "https://github.com/3mcloud/piblin/issues"
Changelog = "https://github.com/3mcloud/piblin/blob/main/CHANGELOG.md"


[project.optional-dependencies]
tests = [
    "pytest==9.0.3",
    "pytest-mpl==0.17.0",
    "pytest-cov==6.0.0",
    "pytest-html==4.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["build", "docs"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I", "UP", "B"]
ignore = [
    "B905",  # zip() without strict=
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["piblin"]
